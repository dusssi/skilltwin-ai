# SkillTwin AI — Render deployment (backend API + Streamlit frontend).
services:
  - type: web
    name: skilltwin-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.api.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard; empty = local Twin mode
      - key: SKILLTWIN_CORS_ORIGINS
        value: https://skilltwin-frontend.onrender.com
      - key: SKILLTWIN_RATE_LIMIT_ENABLED
        value: "true"

  - type: web
    name: skilltwin-frontend
    runtime: python
    buildCommand: pip install -r frontend/requirements.txt
    startCommand: >-
      streamlit run frontend/app.py --server.port $PORT
      --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BACKEND_URL
        value: https://skilltwin-backend.onrender.com
